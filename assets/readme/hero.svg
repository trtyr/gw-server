<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">gw-server — the entire Google Workspace for your AI client</title>
  <desc id="desc">gw-server is an MCP server exposing 45 Google Workspace tools behind a single bearer token: a client connects once and reaches Gmail, Drive, Calendar, Docs, Sheets, Slides, Chat, Tasks and People.</desc>
  <defs>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4285F4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#34A853" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="#0B0E14"/>

  <!-- title block -->
  <g id="title-block" transform="translate(64 54)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7" letter-spacing="2">MCP SERVER · GOOGLE WORKSPACE</text>
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="62" font-weight="700" fill="#E8EAF0">gw-server</text>
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#C9CEDA">The entire Google Workspace, one bearer token away.</text>
    <text x="0" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">45 tools · Streamable HTTP</text>
    <text x="0" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">server-side OAuth · headless login</text>
    <text x="0" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">pure Python · uv · FastAPI</text>
  </g>

  <!-- topology: client -> gw hub -> 9 services (single column, clean fan-out) -->
  <g id="topology" transform="translate(648 0)">
    <!-- client node (vertically centered on hub) -->
    <g id="client">
      <rect x="0" y="120" width="112" height="56" rx="10" fill="#141926" stroke="#2A3245" stroke-width="1.5"/>
      <text x="56" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E8EAF0">pi · MCP</text>
      <text x="56" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8B93A7">client</text>
    </g>

    <!-- pipe to hub -->
    <rect x="112" y="145" width="72" height="6" rx="3" fill="url(#pipe)"/>
    <text x="148" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#4285F4">bearer</text>

    <!-- gw hub -->
    <g id="hub">
      <rect x="184" y="12" width="52" height="272" rx="12" fill="#141926" stroke="#4285F4" stroke-width="1.5"/>
      <text x="210" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#4285F4">gw</text>
      <text x="210" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8B93A7">45</text>
    </g>

    <!-- fan-out: 9 rows, y = 30..270 step 30 -->
    <g id="services" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <line x1="236" y1="30"  x2="288" y2="30"  stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="60"  x2="288" y2="60"  stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="90"  x2="288" y2="90"  stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="120" x2="288" y2="120" stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="150" x2="288" y2="150" stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="180" x2="288" y2="180" stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="210" x2="288" y2="210" stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="240" x2="288" y2="240" stroke="#2A3245" stroke-width="1.5"/>
      <line x1="236" y1="270" x2="288" y2="270" stroke="#2A3245" stroke-width="1.5"/>

      <rect x="288" y="22"  width="16" height="16" rx="4" fill="#2684FC"/><text x="314" y="36"  fill="#C9CEDA">tasks</text>
      <rect x="288" y="52"  width="16" height="16" rx="4" fill="#DB4437"/><text x="314" y="66"  fill="#C9CEDA">people</text>
      <rect x="288" y="82"  width="16" height="16" rx="4" fill="#EA4335"/><text x="314" y="96"  fill="#C9CEDA">gmail</text>
      <rect x="288" y="112" width="16" height="16" rx="4" fill="#34A853"/><text x="314" y="126" fill="#C9CEDA">drive</text>
      <rect x="288" y="142" width="16" height="16" rx="4" fill="#4285F4"/><text x="314" y="156" fill="#C9CEDA">calendar</text>
      <rect x="288" y="172" width="16" height="16" rx="4" fill="#4285F4"/><text x="314" y="186" fill="#C9CEDA">docs</text>
      <rect x="288" y="202" width="16" height="16" rx="4" fill="#0F9D58"/><text x="314" y="216" fill="#C9CEDA">sheets</text>
      <rect x="288" y="232" width="16" height="16" rx="4" fill="#F4B400"/><text x="314" y="246" fill="#C9CEDA">slides</text>
      <rect x="288" y="262" width="16" height="16" rx="4" fill="#00AC47"/><text x="314" y="276" fill="#C9CEDA">chat</text>
    </g>
  </g>
</svg>
